appId: com.omnix.ixaeon
productName: IXAEON
copyright: OMNIX
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
asarUnpack:
  - "**/*.node"
extraResources:
  # MCP STDIO 服务（修复 P1-3）：随安装包携带，位于 resources/mcp/index.mjs。
  # 运行用 Electron 自身（ELECTRON_RUN_AS_NODE=1），无需全局 Node.js。
  - from: ../mcp/dist
    to: mcp
    filter:
      - "**/*"
      - "!**/*.map"
win:
  target:
    - nsis
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: IXAEON-Setup-${version}.${ext}
  shortcutName: IXAEON 析衍
  uninstallDisplayName: IXAEON（析衍）
publish: null
